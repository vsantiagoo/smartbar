<!-- @dsCard group="Identidade" height=430 subtitle="Ícone com luz pulsante + palavra em Arial Bold; entrada animada ao carregar" -->
<style>
  body{margin:0;padding:18px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#2d3d34;background:#f4f6fa}
  .card{border-radius:24px;padding:26px 30px;margin-bottom:14px;position:relative}
  .dark{background:#090a0f}
  .light{background:linear-gradient(160deg,#cfdcee,#dee2ea 40%,#f6ede4)}
  .lbl{position:absolute;top:12px;left:16px;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#89928d}
  .dark .lbl{color:rgba(255,255,255,.4)}
  .row{display:flex;gap:14px}
  .row .card{flex:1;margin:0;display:flex;align-items:center;justify-content:center;min-height:96px}
  .replay{position:absolute;top:8px;right:12px;border:1px solid rgba(255,255,255,.25);background:transparent;color:rgba(255,255,255,.75);border-radius:999px;padding:4px 12px;font-size:.72rem;font-weight:600;cursor:pointer;font-family:inherit}
  .replay:hover{background:rgba(255,255,255,.1)}
  .stage{display:flex;align-items:center;justify-content:center;min-height:118px;padding-top:14px}
  .logo{display:inline-flex;align-items:center;gap:calc(var(--logo-size)*.163)}
  .sb-word{display:inline-block;font-family:Arial,'Helvetica Neue',Helvetica,'Liberation Sans',sans-serif;font-weight:700;line-height:1;white-space:nowrap}
  .sb-halo{transform-origin:65.2px 50px;animation:sb-pulse 2s ease-in-out infinite}
  @keyframes sb-pulse{0%,100%{transform:scale(1)}50%{transform:scale(2.1)}}
  .sb-intro .sb-box{stroke-dasharray:1;animation:sb-draw .5s cubic-bezier(.45,0,.25,1) .09s both}
  .sb-intro .sb-line{stroke-dasharray:1;animation:sb-draw .16s ease-out .62s both}
  .sb-intro .sb-dot{transform-origin:65.2px 50px;animation:sb-pop .28s cubic-bezier(.2,.9,.3,1.25) .9s both}
  .sb-intro .sb-halo{animation:sb-flash .55s ease-in-out .9s both,sb-pulse 2s ease-in-out 1.75s infinite}
  .sb-intro .sb-word{animation:sb-slide .55s cubic-bezier(.16,.84,.3,1) 1.15s both}
  @keyframes sb-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  @keyframes sb-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes sb-flash{0%{transform:scale(.4);opacity:0}55%{transform:scale(1.5);opacity:1}100%{transform:scale(1);opacity:1}}
  @keyframes sb-slide{from{opacity:0;transform:translateX(calc(var(--logo-size)*-.191))}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
<div class="card dark"><span class="lbl">Fundo escuro · tone="light"</span><button class="replay" id="replay">Repetir entrada</button>
  <div class="stage" id="stage"><span class="logo sb-intro" style="--logo-size:80px"><svg viewBox="0 0 100 100" aria-hidden="true" style="width:var(--logo-size);height:var(--logo-size);overflow:visible;flex:none"><defs><radialGradient id="sbh1" gradientUnits="userSpaceOnUse" cx="65.2" cy="50" r="26.9"><stop offset="0" stop-color="rgb(48 139 255)" stop-opacity="0.9"/><stop offset="0.177" stop-color="rgb(48 139 255)" stop-opacity="0.62"/><stop offset="0.29" stop-color="rgb(48 139 255)" stop-opacity="0.4"/><stop offset="0.363" stop-color="rgb(48 139 255)" stop-opacity="0.354"/><stop offset="0.46" stop-color="rgb(48 139 255)" stop-opacity="0.275"/><stop offset="0.556" stop-color="rgb(48 139 255)" stop-opacity="0.2"/><stop offset="0.653" stop-color="rgb(48 139 255)" stop-opacity="0.133"/><stop offset="0.75" stop-color="rgb(48 139 255)" stop-opacity="0.083"/><stop offset="0.847" stop-color="rgb(48 139 255)" stop-opacity="0.046"/><stop offset="1" stop-color="rgb(48 139 255)" stop-opacity="0"/></radialGradient></defs><circle class="sb-halo" cx="65.2" cy="50" r="26.9" fill="url(#sbh1)"/><rect class="sb-box" pathLength="1" x="2.275" y="2.275" width="95.45" height="95.45" rx="14.7" fill="none" stroke="#f2f5fa" stroke-width="4.55" stroke-linecap="round"/><line class="sb-line" pathLength="1" x1="40.4" y1="16.95" x2="40.4" y2="83.05" stroke="#f2f5fa" stroke-width="3.05" stroke-linecap="round"/><g class="sb-dot"><circle cx="65.2" cy="50" r="7.6" fill="#76b6fc"/><circle cx="65.2" cy="50" r="3.5" fill="#e1eeff"/></g></svg><span class="sb-word" style="font-size:calc(var(--logo-size)*.637)"><span style="color:#f2f5fa">Smart</span><span style="color:#4da3ff">Bar</span></span></span></div></div>
<div class="row">
  <div class="card light"><span class="lbl">Fundo claro · tone="brand"</span><span class="logo" style="--logo-size:44px"><svg viewBox="0 0 100 100" aria-hidden="true" style="width:var(--logo-size);height:var(--logo-size);overflow:visible;flex:none"><defs><radialGradient id="sbh2" gradientUnits="userSpaceOnUse" cx="65.2" cy="50" r="26.9"><stop offset="0" stop-color="rgb(48 139 255)" stop-opacity="0.9"/><stop offset="0.177" stop-color="rgb(48 139 255)" stop-opacity="0.62"/><stop offset="0.29" stop-color="rgb(48 139 255)" stop-opacity="0.4"/><stop offset="0.363" stop-color="rgb(48 139 255)" stop-opacity="0.354"/><stop offset="0.46" stop-color="rgb(48 139 255)" stop-opacity="0.275"/><stop offset="0.556" stop-color="rgb(48 139 255)" stop-opacity="0.2"/><stop offset="0.653" stop-color="rgb(48 139 255)" stop-opacity="0.133"/><stop offset="0.75" stop-color="rgb(48 139 255)" stop-opacity="0.083"/><stop offset="0.847" stop-color="rgb(48 139 255)" stop-opacity="0.046"/><stop offset="1" stop-color="rgb(48 139 255)" stop-opacity="0"/></radialGradient></defs><circle class="sb-halo" cx="65.2" cy="50" r="26.9" fill="url(#sbh2)"/><rect class="sb-box" pathLength="1" x="2.275" y="2.275" width="95.45" height="95.45" rx="14.7" fill="none" stroke="#1b3a6b" stroke-width="4.55" stroke-linecap="round"/><line class="sb-line" pathLength="1" x1="40.4" y1="16.95" x2="40.4" y2="83.05" stroke="#1b3a6b" stroke-width="3.05" stroke-linecap="round"/><g class="sb-dot"><circle cx="65.2" cy="50" r="7.6" fill="#76b6fc"/><circle cx="65.2" cy="50" r="3.5" fill="#e1eeff"/></g></svg><span class="sb-word" style="font-size:calc(var(--logo-size)*.637)"><span style="color:#1b3a6b">Smart</span><span style="color:#4da3ff">Bar</span></span></span></div>
  <div class="card dark"><span class="lbl">Celular · só o ícone</span><span class="logo" style="--logo-size:44px"><svg viewBox="0 0 100 100" aria-hidden="true" style="width:var(--logo-size);height:var(--logo-size);overflow:visible;flex:none"><defs><radialGradient id="sbh3" gradientUnits="userSpaceOnUse" cx="65.2" cy="50" r="26.9"><stop offset="0" stop-color="rgb(48 139 255)" stop-opacity="0.9"/><stop offset="0.177" stop-color="rgb(48 139 255)" stop-opacity="0.62"/><stop offset="0.29" stop-color="rgb(48 139 255)" stop-opacity="0.4"/><stop offset="0.363" stop-color="rgb(48 139 255)" stop-opacity="0.354"/><stop offset="0.46" stop-color="rgb(48 139 255)" stop-opacity="0.275"/><stop offset="0.556" stop-color="rgb(48 139 255)" stop-opacity="0.2"/><stop offset="0.653" stop-color="rgb(48 139 255)" stop-opacity="0.133"/><stop offset="0.75" stop-color="rgb(48 139 255)" stop-opacity="0.083"/><stop offset="0.847" stop-color="rgb(48 139 255)" stop-opacity="0.046"/><stop offset="1" stop-color="rgb(48 139 255)" stop-opacity="0"/></radialGradient></defs><circle class="sb-halo" cx="65.2" cy="50" r="26.9" fill="url(#sbh3)"/><rect class="sb-box" pathLength="1" x="2.275" y="2.275" width="95.45" height="95.45" rx="14.7" fill="none" stroke="#f2f5fa" stroke-width="4.55" stroke-linecap="round"/><line class="sb-line" pathLength="1" x1="40.4" y1="16.95" x2="40.4" y2="83.05" stroke="#f2f5fa" stroke-width="3.05" stroke-linecap="round"/><g class="sb-dot"><circle cx="65.2" cy="50" r="7.6" fill="#76b6fc"/><circle cx="65.2" cy="50" r="3.5" fill="#e1eeff"/></g></svg></span></div>
</div>
<script>
  var st=document.getElementById('stage');
  document.getElementById('replay').onclick=function(){var l=st.firstElementChild;l.classList.remove('sb-intro');void l.getBoundingClientRect();l.classList.add('sb-intro');};
</script>
