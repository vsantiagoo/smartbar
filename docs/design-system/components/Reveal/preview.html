<!-- @dsCard group="Movimento" height=300 subtitle="Sobe 28px e aparece em 0,9s; cascata com delay em ms" -->
<style>
  body{margin:0;padding:22px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#2d3d34;line-height:1.6;background:linear-gradient(160deg,#cfdcee 0%,#dee2ea 38%,#ebe8e7 72%,#f6ede4 100%)}
  .lbl{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5b6861;margin:0 0 8px}
  .row{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end}
  body{overflow:hidden}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .top button{border:1px solid rgba(27,58,107,.3);background:rgba(255,255,255,.6);color:#1b3a6b;border-radius:999px;padding:5px 14px;font:600 .78rem/1 inherit;font-family:inherit;cursor:pointer}
  .top button:hover{background:#fff}
  .c{border-radius:28px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);padding:14px 20px;margin-bottom:10px;backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);box-shadow:inset 0 1px 0 0 rgba(255,255,255,.45),0 10px 28px -12px rgba(16,34,63,.45)}
  .c b{display:block;font-size:.95rem}.c span{font-size:.82rem;color:#5b6861}
  .reveal{opacity:0;transform:translate3d(0,28px,0);transition:opacity .9s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1);transition-delay:var(--reveal-delay,0ms)}
  .reveal.is-visible{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none}}
</style>
<div class="top"><p class="lbl" style="margin:0">delay = 0 · 90 · 180 ms</p><button id="r">Repetir</button></div>
<div class="reveal c" style="--reveal-delay:0ms"><b>Receita recuperada</b><span>Primeiro bloco, sem atraso</span></div>
<div class="reveal c" style="--reveal-delay:90ms"><b>Consumo por quarto</b><span>90 ms depois</span></div>
<div class="reveal c" style="--reveal-delay:180ms"><b>Produto mais pedido</b><span>180 ms depois — entrada em cascata</span></div>
<script>
  function play(){var els=document.querySelectorAll('.reveal');els.forEach(function(e){e.classList.remove('is-visible')});void document.body.offsetHeight;requestAnimationFrame(function(){els.forEach(function(e){e.classList.add('is-visible')})});}
  document.getElementById('r').onclick=play;play();
</script>
